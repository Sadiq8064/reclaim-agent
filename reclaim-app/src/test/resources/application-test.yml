server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:reclaim_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

reclaim:
  kafka:
    raw-events-topic: reclaim.events.raw.test
    normalized-events-topic: reclaim.events.normalized.test
  razorpay:
    key-id: rzp_test_dummy
    key-secret: secret_dummy
    webhook-secret: reclaim_test_secret_hmac256
    base-url: http://localhost:8989/v1
  llm:
    provider: gemini
    api-key: test_api_key
    model: gemini-2.5-flash
    base-url: http://localhost:8989/v1beta
